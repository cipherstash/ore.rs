name: "Test"
on:
  push:
    branches:
      - main
  # Run on every pull request regardless of base branch, so stacked PRs that
  # target a feature/integration branch (e.g. the ore-v2 stack) get CI too —
  # not only PRs into `main`.
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    # Both architectures: aarch64 runs hardware AES (`--cfg aes_armv8`), the
    # NEON kernels and the NEON PRP builder, which x86_64 never reaches, against
    # the same pinned vectors.
    runs-on: ${{ matrix.os }}
    name: "🧪 Test (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - name: clippy
        run: cargo clippy --no-deps --all-targets --all-features  -- -D warnings

      # The steps here build with `--all-features`; this one builds ore-rs
      # with none, so code behind a feature (`test-support`, `ct-bench`)
      # cannot leave an unused import that only the default build sees.
      - name: clippy (no features)
        run: cargo clippy --no-deps -p ore-rs --all-targets -- -D warnings

      # The same for clww-ore, whose only feature is `postgres-types`, off by
      # default.
      - name: clippy (clww-ore, no features)
        run: cargo clippy --no-deps -p clww-ore --all-targets -- -D warnings

      - name: format
        run: cargo fmt -- --check

      # Clippy denies the panic lints in library code; it has none for
      # `assert!` / `debug_assert!`, so this covers them.
      - name: no runtime asserts
        run: python3 scripts/no-runtime-asserts.py

      # Broken or private intra-doc links fail here rather than on docs.rs.
      - name: docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: test
        run: cargo test --all-features

      # `ct_bench` and its tests compile only with this feature; the clippy
      # step above builds them but never runs them.
      - name: test (ct-bench)
        run: cargo test -p ore-rs --features ct-bench --lib ct_bench

  # clww-ore's `install.sql` has its own copy of the ORE comparison, which
  # Postgres uses for `<`, `=` and the btree operator classes. The e2e tests
  # check it against the Rust comparators; they are `#[ignore]`d in the plain
  # test run because they need a database.
  e2e:
    runs-on: ubuntu-latest
    name: "🐘 clww-ore SQL e2e"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cllwtest
          # `setup_db()` connects as `postgres` with no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-e2e-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: install.sql
        run: psql -h localhost -U postgres -d cllwtest -v ON_ERROR_STOP=1 -f packages/clww-ore/install.sql

      - name: e2e
        run: cargo test -p clww-ore --all-features --test sql_compare_test --test sql_compare_lex_test -- --ignored

  bench:
    runs-on: ubuntu-latest
    name: "⏱ Benchmark"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      # ore-rs only: clww-ore's criterion suite runs locally, with
      # `cargo bench -p clww-ore`, rather than on every PR.
      - name: "Benchmark"
        run: cargo bench -p ore-rs
