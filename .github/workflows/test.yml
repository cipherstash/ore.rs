name: "Test"
on:
  push:
    branches:
      - main
  # Run on every pull request regardless of base branch, so stacked PRs that
  # target a feature/integration branch (e.g. the ore-v2 stack) get CI too —
  # not only PRs into `main`.
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    runs-on: ubuntu-latest
    name: "🧪 Test"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust 1.78
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: clippy, rustfmt

      - name: clippy
        run: cargo clippy --no-deps --all-targets --all-features  -- -D warnings

      - name: format
        run: cargo fmt -- --check

      - name: test
        run: cargo test

  bench:
    runs-on: ubuntu-latest
    name: "⏱ Benchmark"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust 1.78
        uses: dtolnay/rust-toolchain@1.78.0

      - name: "Benchmark"
        run: cargo bench
