name: "Test"
on:
  push:
    branches:
      - main
  # Run on every pull request regardless of base branch, so stacked PRs that
  # target a feature/integration branch (e.g. the ore-v2 stack) get CI too —
  # not only PRs into `main`.
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    # Both architectures: aarch64 runs hardware AES (`--cfg aes_armv8`), the
    # NEON kernels and the NEON PRP builder, which x86_64 never reaches, against
    # the same pinned vectors.
    runs-on: ${{ matrix.os }}
    name: "🧪 Test (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - name: clippy
        run: cargo clippy --no-deps --all-targets --all-features  -- -D warnings

      # The steps here build with `--all-features`; this one builds ore-rs
      # with none, so code behind `cfg(feature = "vitaminc")` (or any other
      # feature) cannot leave an unused import that only the default build
      # sees.
      - name: clippy (no features)
        run: cargo clippy --no-deps -p ore-rs --all-targets -- -D warnings

      # clww-ore's default features include `postgres-types`, so its
      # no-features build is a separate one.
      - name: clippy (clww-ore, no features)
        run: cargo clippy --no-deps -p clww-ore --all-targets --no-default-features -- -D warnings

      - name: format
        run: cargo fmt -- --check

      # Clippy denies the panic lints in library code; it has none for
      # `assert!` / `debug_assert!`, so this covers them.
      - name: no runtime asserts
        run: python3 scripts/no-runtime-asserts.py

      # Broken or private intra-doc links fail here rather than on docs.rs.
      - name: docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: test
        run: cargo test --all-features

      # `ct_bench` and its tests compile only with this feature; the clippy
      # step above builds them but never runs them.
      - name: test (ct-bench)
        run: cargo test -p ore-rs --features ct-bench --lib ct_bench

  bench:
    runs-on: ubuntu-latest
    name: "⏱ Benchmark"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      # ore-rs only: clww-ore's criterion suite runs locally, with
      # `cargo bench -p clww-ore`, rather than on every PR.
      - name: "Benchmark"
        run: cargo bench -p ore-rs
