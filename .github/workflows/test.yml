name: "Test"
on:
  push:
    branches:
      - main
  # Run on every pull request regardless of base branch, so stacked PRs that
  # target a feature/integration branch (e.g. the ore-v2 stack) get CI too —
  # not only PRs into `main`.
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    # Both architectures: aarch64 runs hardware AES (ARMv8 Crypto Extensions), the
    # NEON kernels and the NEON PRP builder, which x86_64 never reaches, against
    # the same pinned vectors.
    runs-on: ${{ matrix.os }}
    name: "🧪 Test (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt

      - name: clippy
        run: cargo clippy --no-deps --all-targets --all-features  -- -D warnings

      - name: format
        run: cargo fmt -- --check

      - name: test
        run: cargo test --all-features

      # `ct_bench` and its tests compile only with this feature; the clippy
      # step above builds them but never runs them.
      - name: test (ct-bench)
        run: cargo test -p ore-rs --features ct-bench --lib ct_bench

  bench:
    runs-on: ubuntu-latest
    name: "⏱ Benchmark"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: "Benchmark"
        run: cargo bench
