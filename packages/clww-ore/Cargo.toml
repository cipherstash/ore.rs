[package]
name = "cllw-ore"
version = "0.2.0"
description = "Fast, efficient Order-Revealing Encryption using CLLW scheme"
documentation = "https://docs.rs/cllw-ore"
license-file = "LICENSE"
edition.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bit-vec = "0.8.0"
bitvec = "1.0.1"
blake3 = "1.5.4"
hex = { workspace = true }
postgres-derive = "0.4.6"
postgres-types = { version = "0.2.8", features = ["derive", "array-impls"] }
regex = "1.11.0"
subtle = "2.6.1"
thiserror.workspace = true
unicode-normalization = "0.1.24"
vitaminc = { workspace = true }

[dev-dependencies]
criterion = "0.5.1"
derive = "1.0.0"
features = "0.10.0"
hex.workspace = true
paste = "1.0.15"
postgres = "0.19.9"
quickcheck = "1.0.3"

[[bench]]
name = "bench"
harness = false
