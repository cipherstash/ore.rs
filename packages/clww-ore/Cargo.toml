[package]
name = "cllw-ore"
version = "0.4.0"
description = "Fast, efficient Order-Revealing Encryption using CLWW scheme"
documentation = "https://docs.rs/cllw-ore"
license-file = "LICENSE"
edition.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# WARNING: The postgres-types feature is currently enabled by default for backwards compatibility,
# but this will change in a future major version. Please explicitly enable this feature if you need it.
default = ["postgres-types"]
postgres-types = ["dep:postgres-types"]

[dependencies]
blake3 = "1.5.4"
hex = { workspace = true }
postgres-types = { version = "0.2.8", features = ["derive", "array-impls"], optional = true }
subtle = "2.6.1"
thiserror.workspace = true
unicode-normalization = "0.1.24"

[dev-dependencies]
criterion = "0.5.1"
derive = "1.0.0"
features = "0.10.0"
hex.workspace = true
paste = "1.0.15"
postgres = "0.19.9"
quickcheck = "1.0.3"

[[bench]]
name = "bench"
harness = false
