[package]
name = "clww-ore"
# The crate was `cllw-ore` up to 0.5.1 (cipherstash-suite); it is published
# fresh under the authors' initials, Chenette, Lewi, Weis and Wu, from 0.6.0.
version = "0.6.0"
description = "Fast, efficient Order-Revealing and Order-Preserving Encryption using CLWW schemes"
documentation = "https://docs.rs/clww-ore"
# PolyForm Internal Use, as in cipherstash-suite. Adopting the workspace's
# licence needs sign-off, and until it has it the crate is not published:
# release-plz publishes every workspace crate whose version is not on
# crates.io.
license-file = "LICENSE"
publish = false
edition = "2021"
repository = "https://github.com/cipherstash/ore.rs"
homepage = "https://cipherstash.com"
keywords = ["cryptography", "security", "databases", "encryption", "sql"]
categories = ["cryptography", "database"]

[features]
# WARNING: The postgres-types feature is currently enabled by default for backwards compatibility,
# but this will change in a future major version. Please explicitly enable this feature if you need it.
default = ["postgres-types"]
postgres-types = ["dep:postgres-types"]
# Adds OPE support for `rust_decimal::Decimal`.
decimal = ["dep:rust_decimal", "dep:orderable-bytes", "orderable-bytes/decimal"]
# Adds OPE support for `chrono::NaiveDate` and `chrono::DateTime<Utc>`.
chrono = ["dep:chrono", "dep:orderable-bytes", "orderable-bytes/chrono"]

[dependencies]
# `zeroize` wipes the keyed hasher and its output readers on drop.
blake3 = { version = "1.5.4", features = ["zeroize"] }
chrono = { version = "0.4.42", default-features = false, optional = true }
hex = "0.4.3"
orderable-bytes = { version = "0.1.1", default-features = false, optional = true }
postgres-types = { version = "0.2.8", features = ["derive", "array-impls"], optional = true }
rust_decimal = { version = "1.28", default-features = false, optional = true }
subtle = "2.6.1"
thiserror = "1.0.56"
unicode-normalization = "0.1.24"
# vitaminc-ore's `OrderScheme` and `OrderQuery`, implemented by `ClwwOre`
# and `ClwwOpe`: vitaminc seals every plaintext and owns the encodings, as
# it does for ore-rs.
vitaminc-ore = "0.8.0"
vitaminc-protected = "0.8.0"
zeroize = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
criterion = "0.5.1"
hex = "0.4.3"
paste = "1.0.15"
postgres = "0.19.9"
quickcheck = "1.0.3"
# Test-only: macros for constructing `Decimal` literals in unit tests.
rust_decimal_macros = "1.28"
# The conformance checks vitaminc-ore runs against a real scheme.
vitaminc-ore = { version = "0.8.0", features = ["test-support"] }

[[bench]]
name = "bench"
harness = false

# The e2e SQL tests bind ciphertexts as Postgres parameters.
[[test]]
name = "sql_compare_test"
required-features = ["postgres-types"]

[[test]]
name = "sql_compare_lex_test"
required-features = ["postgres-types"]
