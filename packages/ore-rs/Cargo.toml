[package]
name = "ore-rs"
version = "0.9.0"
authors = [
    "Dan Draper <dan@cipherstash.com>",
    "James Sadler <james@cipherstash.com>",
]
edition = "2018"
# The floor without the `vitaminc` feature, which needs 1.88 (vitaminc's).
# CI checks it in the `msrv` job; clippy reads it to hold back newer APIs.
rust-version = "1.78"
homepage = "https://cipherstash.com"
repository = "https://github.com/cipherstash/ore.rs"
documentation = "https://docs.rs/ore-rs"
description = "Order-revealing encryption library used by the CipherStash searchable encryption platform"
license-file = "../../LICENCE"
readme = "README.md"

# docs.rs builds default features only; these show the chrono and decimal
# impls and the vitaminc adapter. (`ct-bench` and the Kani features are not
# public API.)
[package.metadata.docs.rs]
features = ["chrono", "decimal", "vitaminc"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dev-dependencies]
criterion = "0.5.1"
# Test-only: only used inside `#[cfg(test)]`, doc-test snippets, examples,
# and benches — never inside the library proper.
hex-literal = "0.4.1"
quickcheck = "1.0.3"
# Test-only: macros for constructing `Decimal` literals in unit tests.
rust_decimal_macros = "1.28"

[features]
# Adds ORE support for `chrono::NaiveDate` and `chrono::DateTime<Utc>`. The
# orderable-bytes encoders live in the sibling `orderable-bytes` crate.
chrono = ["dep:chrono", "orderable-bytes/chrono"]
# Adds ORE support for `rust_decimal::Decimal` via a fixed-length 14-byte
# order-preserving encoding fed into the existing fixed-N ORE machinery.
# The encoder lives in the sibling `orderable-bytes` crate.
decimal = ["dep:rust_decimal", "orderable-bytes/decimal"]
# Exposes `ct_bench`, timing-measurement entry points to otherwise private
# primitives, for the detached `packages/ct-dudect` crate. Not part of the
# public API: a feature rather than a `cfg` so it never trips
# `unexpected_cfgs`, and never enabled by a dependant.
ct-bench = []
# Implements vitaminc-ore's `OrderScheme` for the block ORE schemes, so a
# vitaminc order index can encrypt its sealed order plaintexts here (ADR
# 0002 in cipherstash/stack: vitaminc at the bottom, scheme crates
# implement the trait). Off by default: cipherstash-client takes no
# vitaminc dependency. Needs Rust 1.88, vitaminc's floor, above the
# crate's `rust-version`. CI builds on 1.88, and lints the crate with the
# feature off as well as on; the `msrv` job builds without it on 1.78.
vitaminc = ["dep:vitaminc-ore", "dep:vitaminc-hmac", "dep:vitaminc-prf", "dep:vitaminc-protected"]
# Adds the two heaviest Kani harnesses: exhaustive-length `ct_select_byte`
# (about 9 minutes) and SWAR-builder equivalence (about 15 minutes on an M4,
# too heavy for GitHub's runners). CI runs `cargo kani` without it; run
# `cargo kani -p ore-rs --features kani-full` for the complete set.
kani-full = []

[dependencies]
aes = { version = "0.8.2", features = ["zeroize"] }
block-modes = "0.9.1"
byteorder = "1.4.3"
chrono = { version = "0.4.42", default-features = false, optional = true }
orderable-bytes = { path = "../orderable-bytes", version = "^0.2", default-features = false }
rand = "0.8.6"
rand_chacha = "0.3.1"
rust_decimal = { version = "1.28", default-features = false, optional = true }
num = "0.4.0"
hex = "0.4.3"
subtle-ng = "2.5.0"
zeroize = { version = "1.5.7", features = ["zeroize_derive"] }
thiserror = "1.0.38"
# vitaminc 0.6 is the first release with the `OrderScheme` trait.
vitaminc-ore = { version = "0.6.1", optional = true }
vitaminc-hmac = { version = "0.6.1", optional = true }
vitaminc-prf = { version = "0.6.1", optional = true }
vitaminc-protected = { version = "0.6.1", optional = true }

# `cfg(kani)` gates the Kani proof harnesses (compiled only by `cargo kani`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[[bench]]
name = "oreaes128"
harness = false

[[bench]]
name = "bit6"
harness = false

[[bench]]
name = "decimal"
harness = false
required-features = ["decimal"]

[[bench]]
name = "chrono"
harness = false
required-features = ["chrono"]

[[bench]]
name = "chained"
harness = false

[[bench]]
name = "prp_build"
harness = false
required-features = ["ct-bench"]

[[example]]
name = "encrypt"
