[package]
name = "ore-rs"
version = "0.9.0"
authors = [
    "Dan Draper <dan@cipherstash.com>",
    "James Sadler <james@cipherstash.com>",
]
edition = "2018"
# vitaminc's floor.
rust-version = "1.88"
homepage = "https://cipherstash.com"
repository = "https://github.com/cipherstash/ore.rs"
documentation = "https://docs.rs/ore-rs"
description = "Order-revealing encryption library used by the CipherStash searchable encryption platform"
license-file = "../../LICENCE"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dev-dependencies]
criterion = "0.5.1"
# Test-only: only used inside `#[cfg(test)]`, doc-test snippets, examples,
# and benches — never inside the library proper.
hex-literal = "0.4.1"
quickcheck = "1.0.3"
# The typed rows of vitaminc's `FitsIn` table, for the tests that encrypt
# dates, timestamps, decimals and uuids as a caller holds them.
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
rust_decimal = { version = "1.41", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false }
# This crate's own `test-support` feature, on for its tests, and the
# conformance checks vitaminc-ore runs against a real scheme.
ore-rs = { path = ".", features = ["test-support"] }

[features]
# Seeded constructors for the schemes, so a test can pin a full
# ciphertext's bytes, and vitaminc-ore's conformance checks. A seeded
# scheme draws every nonce from the seed, so it must never ship: two
# values encrypted under one seed share their nonces, which the scheme's
# security assumes they do not.
test-support = ["vitaminc-ore/test-support"]
# Exposes `ct_bench`, timing-measurement entry points to otherwise private
# primitives, for the detached `packages/ct-dudect` crate. Not part of the
# public API: a feature rather than a `cfg` so it never trips
# `unexpected_cfgs`, and never enabled by a dependant.
ct-bench = []
# Adds the two heaviest Kani harnesses: exhaustive-length `ct_select_byte`
# (about 9 minutes) and SWAR-builder equivalence (about 15 minutes on an M4,
# too heavy for GitHub's runners). CI runs `cargo kani` without it; run
# `cargo kani -p ore-rs --features kani-full` for the complete set.
kani-full = []

[dependencies]
aes = { version = "0.8.2", features = ["zeroize"] }
block-modes = "0.9.1"
byteorder = "1.4.3"
num = "0.4.0"
hex = "0.4.3"
subtle-ng = "2.5.0"
zeroize = { version = "1.5.7", features = ["zeroize_derive"] }
thiserror = "1.0.38"
# `TryRng`, to draw a nonce from a `SafeRand`; the `chacha` feature is
# for the tests' seeded generators.
rand = { version = "0.10.1", features = ["chacha"] }
# vitaminc is the typed front door (docs/plans/2026-10-19-ore-0-10-vitaminc-front-door.md):
# vitaminc-ore seals every plaintext and owns the encodings, and the
# schemes here implement its traits. 0.7 is the release that brings
# `open` per space and `OrderQuery`.
vitaminc-ore = { version = "0.7.0", features = ["chrono", "rust_decimal", "uuid"] }
vitaminc-hmac = "0.7.0"
vitaminc-prf = "0.7.0"
vitaminc-protected = "0.7.0"
vitaminc-random = "0.7.0"
vitaminc-context = "0.7.0"

# `cfg(kani)` gates the Kani proof harnesses (compiled only by `cargo kani`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[[bench]]
name = "oreaes128"
harness = false

[[bench]]
name = "bit6"
harness = false

[[bench]]
name = "chained"
harness = false

[[bench]]
name = "prp_build"
harness = false
required-features = ["ct-bench"]

[[example]]
name = "encrypt"
