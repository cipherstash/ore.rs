[workspace]
resolver = "2"
members = [
    "packages/ore-rs",
    "packages/orderable-bytes",
]

[patch.crates-io]
# version 3.16.0
bumpalo = { git = 'https://github.com/fitzgen/bumpalo.git', rev = "4eeab88" }
# Unreleased: block-ciphers #598 fixes the aarch64 slowdown in aes 0.9.3.
# A patch only applies to this workspace (CI, benches), not to crates.io
# users, so ore-rs must not be released while this is here. Remove it once
# an aes release after 0.9.3 is out.
aes = { git = "https://github.com/RustCrypto/block-ciphers", rev = "b99ebe6a2d394833a14a84b79aac60c0c0611577" }
